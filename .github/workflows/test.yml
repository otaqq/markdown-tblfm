name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['27.2', '28.2', '29.4', '30.2', '31.1', snapshot]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}
      - uses: emacs-eask/setup-eask@v3
        with:
          version: '0.12.9'
      - run: make deps
      - run: make all
